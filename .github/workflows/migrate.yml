# Aplica as migrations do Prisma no banco do ambiente certo, conforme o branch que recebeu o push.
#   master  -> GitHub Environment "production"  (Neon branch "production")
#   develop -> GitHub Environment "development" (Neon branch "development")
# Em cada Environment (Settings → Environments), crie o secret DATABASE_URL com a string
# de conexão DIRETA (sem "-pooler" no host): o lock de migration não funciona pelo pooler.
name: Migrate database

on:
  push:
    branches: [master, develop]
    paths: ["prisma/**", ".github/workflows/migrate.yml"]
  workflow_dispatch:

concurrency:
  group: migrate-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'master' && 'production' || 'development' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # sem scripts de instalação: pacotes de terceiros nunca rodam com o secret no ambiente
      - run: npm ci --ignore-scripts
      # generate não conecta no banco; a URL falsa só satisfaz o env() do prisma.config.ts
      - name: prisma generate
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
      # o secret existe SÓ neste passo
      - name: prisma migrate deploy
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
